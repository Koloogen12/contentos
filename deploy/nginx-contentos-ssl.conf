# ContentOS nginx site for Selectel `mml-prod-1` — SSL variant.
# Used after certbot has issued the cert. Owned end-to-end by us, so it can be
# safely rewritten on every deploy without losing the :443 server block.
#   https://__DOMAIN__/api/*   → FastAPI on 127.0.0.1:8096
#   https://__DOMAIN__/*       → Next.js on 127.0.0.1:8098
#   http://__DOMAIN__/*        → 301 → https://__DOMAIN__/...
#                                (except /.well-known/acme-challenge/ for renewals)

upstream contentos_frontend {
    server 127.0.0.1:8098;
    keepalive 32;
}

upstream contentos_api {
    server 127.0.0.1:8096;
    keepalive 32;
}

# HTTP → HTTPS redirect, keeping ACME challenge passthrough for renewals.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.24 (Ubuntu 24.04) syntax — http2 is a listen flag, not a separate
    # directive (the `http2 on;` form requires nginx ≥ 1.25.1).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Generous body limit for audio / file uploads
    client_max_body_size 600M;

    # Default proxy headers
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # SSE skill-run stream — long timeouts, no buffering
    location ~ ^/api/v1/skill-runs/.+/stream$ {
        proxy_pass http://contentos_api;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Backend API + auth + everything under /api/
    location /api/ {
        proxy_pass http://contentos_api;
        proxy_connect_timeout 30s;
        proxy_send_timeout 5m;
        proxy_read_timeout 5m;
    }

    # Backend health check
    location = /health {
        proxy_pass http://contentos_api/health;
    }

    # Default → Next.js frontend (covers /p/{token} public canvas viewer too)
    location / {
        proxy_pass http://contentos_frontend;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
